name: Publish APK release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must be v<versionCode>, e.g. v5)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          APK="AutoClash-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/$APK"
          cd release-assets
          sha256sum "$APK" > "$APK.sha256"
          ls -l
          cat "$APK.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: AutoClash ${{ steps.version.outputs.name }}
          body: |
            AutoClash ${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }}).

            Install updates from the app: Settings → Updates → Check GitHub for updates.
          files: release-assets/*
          fail_on_unmatched_files: true
